# Cấu hình RAM cho nRF51822 (16KB)
CONFIG_SRAM_SIZE=16

# Tối ưu Stack tối thiểu
CONFIG_MAIN_STACK_SIZE=512
CONFIG_IDLE_STACK_SIZE=256
CONFIG_ISR_STACK_SIZE=256

# TẮT UART / CONSOLE ngầm (Tránh kẹt Bootloader do thiếu chân TX/RX)
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# ÉP DÙNG RC NỘI 32.768kHz (Vì mạch hàn không có LFXO/Tụ gánh)
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# Driver GPIO cơ bản
CONFIG_GPIO=y
CONFIG_NFCT_PINS_AS_GPIOS=y